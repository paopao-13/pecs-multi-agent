name: Production Benchmark CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run production benchmark (CI gate, no LLM key)
        # --ci 隐含 --skip-run-task：纯服务层门禁（启动/延迟/并发/容错/稳定性/HOL），
        # 任意一项不达标即退出码 2 → PR 变红。不消耗任何 LLM 额度。
        run: python scripts/benchmark_production.py --ci

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bench
          path: results/production_bench.json

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        # 测试已用 monkeypatch mock 掉 call_llm / execute_tool，无需 API Key 即可离线运行，
        # 不消耗任何 LLM 额度。与 benchmark job 互为补充：后者守服务层，本 job 守代码层。
        # 任一用例失败即退出码非 0 → PR 变红。
        run: python -m pytest -m "not slow and not requires_api" --tb=short
