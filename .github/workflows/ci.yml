name: Production Benchmark CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run production benchmark (CI gate, no LLM key)
        # --ci 隐含 --skip-run-task：纯服务层门禁（启动/延迟/并发/容错/稳定性/HOL），
        # 任意一项不达标即退出码 2 → PR 变红。不消耗任何 LLM 额度。
        run: python scripts/benchmark_production.py --ci

      - name: Upload benchmark report
        # 上传是"辅助产物"，不该有阻断 CI 的能力：实测 GitHub 的
        # ArtifactService 偶发超时（Request timeout after 5 attempts）会让整个
        # job 变红，而测试步骤其实是过的 —— 那是把"GitHub 存储服务是否可用"
        # 混进了"代码是否通过门禁"。CI 门禁只应对代码问题负责。
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-bench
          path: results/production_bench.json
          if-no-files-found: warn

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        # 测试已用 monkeypatch mock 掉 call_llm / execute_tool，无需 API Key 即可离线运行，
        # 不消耗任何 LLM 额度。与 benchmark job 互为补充：后者守服务层，本 job 守代码层。
        # 任一用例失败即退出码非 0 → PR 变红。
        #
        # 标记说明：实际使用的是 requires_api_key（tests/conftest.py 注册，无 Key 时自动 skip），
        # requires_api 是历史别名、无任何用例使用；这里两个都排除以免将来再出现
        # "过滤了 A 名字、用例用的是 B 名字" 的静默失效。
        run: python -m pytest -m "not slow and not requires_api and not requires_api_key" --tb=short --cov=tools --cov=metrics --cov=logger --cov-report=term-missing --cov-fail-under=60

      # 覆盖率门禁范围说明（为什么不是全仓）：
      #   tools / metrics / logger 是纯逻辑与可观测层，可离线测、也最该守住；
      #   agents / scripts 大量分支依赖真实 LLM（打网络、花额度），强行覆盖
      #   会把测试变成"烧钱且不稳定"。门禁取 60%（本范围实测 63%，留 3pp 缓冲），
      #   目的是防倒退，不是追数字。
      #   注意区分两个数字：63% 是**门禁范围**（tools/metrics/logger）的覆盖率；
      #   全仓含 agents 的总覆盖率约 65%——对外引用时要说明是哪一个。
      #
      # agents/ 为何**已补测试但仍不入门禁**（2026-09-12 决策，非遗漏）：
      #   agents/ 现有 mock 测试覆盖 58–76%，关键降级路径都有具名断言（异常收敛、
      #   失败前缀检测、非法 action 过滤、零 LLM 路径）。不纳入门禁的三个理由：
      #     ① 覆盖率波动在 agents/ 里噪声大——分支数与 LLM 交互形态耦合，掉 5pp
      #        可能只是"这次多写了几个分支"，不构成可靠的退化信号；
      #     ② 为凑阈值最省力的做法是补"调用一次、断言不抛异常"的空转用例，
      #        能刷数字但抓不到真问题（本次真正挖出 3 个缺陷的用例，针对的是
      #        降级路径，与百分比无关）；
      #     ③ 想守的边界已用更精确的方式守住——具名断言失败比阈值告警更直接。
      #   若将来 agents/ 出现更多纯逻辑模块（新启发式/确定性路径），应只把这些
      #   模块单独加进 --cov，而不是整包纳入。

      - name: Run capability eval (ci tier, zero LLM cost)
        # 只跑"不进 LLM 就能判定"的断言（空输入 400 / 超长 413 / 缺字段 422 / 未授权 401），
        # 零 LLM 消耗，所以可以每次提交都跑。语义质量与对抗用例在 nightly 档，按需执行：
        #   python evals/run_eval.py --mode nightly [--limit N]
        # 失败即退出码 1 → PR 变红（对抗与安全类断言零容忍）。
        run: python evals/run_eval.py --mode ci

  # 部署件实跑验证（不需要任何外部机器——runner 预装 Docker）。
  #
  # 背景：`Dockerfile` 长期只是"静态核对正确"，从未真实构建过（本机无 Docker）。
  # 而它历史上曾指向已废弃的 Flask 应用（app:app:5000 + /api/gaia_samples），
  # 容器能起来但健康检查必失败 —— 部署件一直是坏的且无人发现。
  # 本 job 把"看起来对"变成"确实能跑"：真实构建 → 安全断言 → 启动 → 探活。
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        # 用 requirements-lock.txt（精确版本快照）构建，保证可复现
        run: docker build -t pecs:ci .

      - name: Assert .env not baked into image
        # 安全断言：`COPY . .` 是否把凭据打进镜像层。.dockerignore 已排除 .env，
        # 但这条断言让它成为"被验证的约束"而非"文档里的承诺"——镜像一旦含密钥，
        # 推送镜像就等于泄露，且镜像层删除无法真正抹除。
        run: |
          if docker run --rm --entrypoint sh pecs:ci -c 'test -f /app/.env'; then
            echo "::error::镜像内含 .env，凭据已进入镜像层"
            exit 1
          fi
          echo "OK: 镜像内无 .env"

      - name: Start container
        # 无 LLM Key 也必须能起来：/health 恒返回 200，"依赖未就绪"由
        # llm_configured / llm_reason 字段单独暴露，探针不会被依赖故障误杀。
        # PEC_SKIP_LLM_PROBE=1 跳过启动期真实探测，避免无 Key 时白等超时。
        run: |
          docker run -d --name pecs -p 8000:8000 \
            -e PEC_SKIP_LLM_PROBE=1 \
            -e RUN_MODE=business \
            pecs:ci

      - name: Wait for /health and verify payload
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health -o /tmp/health.json; then
              echo "健康检查通过（第 $i 次探测）："
              cat /tmp/health.json
              # 断言关键字段存在，避免"200 但响应体不对"的假通过
              python -c "
          import json
          d = json.load(open('/tmp/health.json'))
          for k in ('status', 'llm_configured', 'run_mode', 'prompt_version'):
              assert k in d, f'缺少字段 {k}'
          assert d['run_mode'] == 'business', f\"RUN_MODE 未生效: {d['run_mode']}\"
          print('OK: /health 字段完整，RUN_MODE=business 已生效')
          "
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health 探测 30 次（约 60s）未通过"
          docker logs pecs
          exit 1

      - name: Verify Docker HEALTHCHECK reports healthy
        # 容器自身的 HEALTHCHECK 指令（interval 30s，需等其跑完一轮）
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' pecs)
            echo "HEALTHCHECK status = $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && echo "::error::容器健康检查失败" && docker logs pecs && exit 1
            sleep 5
          done
          echo "::error::HEALTHCHECK 未在预期时间内转为 healthy"
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f pecs || true
