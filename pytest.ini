[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: 标记需要长时间运行的测试
    requires_api: 标记需要 API Key 的测试
    requires_api_key: 标记需要 LLM_API_KEY 的测试（tests/conftest.py 实际注册并使用的标记名）
