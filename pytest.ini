[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: 标记需要长时间运行的测试
    requires_api: 【历史别名，已不再使用】早期写下的名字，实际从未被任何用例使用；保留注册仅为兼容旧命令，新代码一律用 requires_api_key
    requires_api_key: 标记需要 LLM_API_KEY 的测试用例（tests/conftest.py 注册并在无 Key 时自动 skip）
